trigger: # Continuous Integration (CI) trigger for pushes to specified branches
- main

pr: # Pull Request (PR) trigger configuration
  branches:
    include:
    - main # Trigger pipeline for Pull Requests targeting the 'main' branch
  # paths:
  #   include:
  #   - 'src/*'
  #   exclude:
  #   - 'docs/*'
  #   - '*.md'

pool:
  vmImage: 'ubuntu-latest'

variables:
# - group: test pipeline # Este bloque es para referenciar el grupo

- name: NODE_VERSION
  value: '18.x'
- name: PYTHON_VERSION
  value: '3.10'

- name: AGENT_BINARY_NAME
  value: 'test-report-agent'
- name: AGENT_BINARY_URL
  value: 'https://github.com/hu-it/pt8n_ado_t_test_agent_binary/releases/download/v0.0.1/test-report-agent'

- name: ROOT_PROJECT_DIR
  value: '.'
- name: PLAYWRIGHT_PROJECT_DIR
  value: './playwright-project'
- name: PLAYWRIGHT_HTML_REPORT_DIR
  value: '$(PLAYWRIGHT_PROJECT_DIR)/playwright-report' # Puede usar otras variables definidas aquí o en el grupo
- name: PLAYWRIGHT_JUNIT_RESULTS_DIR
  value: '$(PLAYWRIGHT_PROJECT_DIR)/test-results'
- name: PLAYWRIGHT_JUNIT_FULL_PATH
  value: '$(PLAYWRIGHT_JUNIT_RESULTS_DIR)'

- name: CYPRESS_PROJECT_DIR
  value: './cypress-project'
- name: CYPRESS_JUNIT_REPORTS_DIR
  value: '$(CYPRESS_PROJECT_DIR)/results'
- name: CYPRESS_VIDEOS_DIR
  value: '$(CYPRESS_PROJECT_DIR)/cypress/videos'
- name: CYPRESS_SCREENSHOTS_DIR
  value: '$(CYPRESS_PROJECT_DIR)/cypress/screenshots'

- name: PYTEST_BDD_PROJECT_DIR
  value: './pytest-bdd-allure-project'
- name: PYTEST_BDD_ALLURE_RESULTS_DIR
  value: '$(PYTEST_BDD_PROJECT_DIR)/allure-results'

stages:
- stage: BuildAndTest
  displayName: 'Build and Test Stage'
  jobs:
  # Job for Playwright Tests
  - job: PlaywrightTests
    displayName: 'Run Playwright Tests'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Install Node.js $(NODE_VERSION)'

    - script: |
        echo "Downloading agent binary: $(AGENT_BINARY_NAME) from $(AGENT_BINARY_URL)"
        curl -L -o $(AGENT_BINARY_NAME) "$(AGENT_BINARY_URL)"
        chmod +x $(AGENT_BINARY_NAME)
      displayName: 'Download Agent Binary'
      workingDirectory: '$(ROOT_PROJECT_DIR)' # Agent binary expects to run where report is, or adjust path
      condition: succeededOrFailed()

    - script: |
        npm ci
      displayName: 'Install Playwright Project Dependencies (npm ci)'
      workingDirectory: '$(PLAYWRIGHT_PROJECT_DIR)'

    - script: |
        npx playwright install --with-deps
      displayName: 'Install Playwright Browsers & Dependencies'
      workingDirectory: '$(PLAYWRIGHT_PROJECT_DIR)'

    - script: |
        mkdir -p $(PLAYWRIGHT_JUNIT_RESULTS_DIR)
      displayName: 'Create Playwright JUnit results directory'
      workingDirectory: '$(PLAYWRIGHT_PROJECT_DIR)'

    - script: |
        npm test
      displayName: 'Run Playwright Tests (npm test)'
      workingDirectory: '$(PLAYWRIGHT_PROJECT_DIR)'
      continueOnError: true

    - script: |
        echo "Run agent binary: $(AGENT_BINARY_NAME)"

        echo "Setting environment variables for agent:"
        echo "AGENT_REPORT_PATH=$(PLAYWRIGHT_JUNIT_FULL_PATH)"
        echo "AGENT_REPORT_FORMAT=junit"
        echo "AGENT_REPORTER_TYPE=azuredevops"
        echo "AGENT_AZDO_ORG=$(AGENT_AZDO_ORG)"
        echo "AGENT_AZDO_PROJECT=$(AGENT_AZDO_PROJECT)"
        echo "AGENT_AZDO_TEST_POINT_ID=$(AGENT_AZDO_TEST_POINT_ID)"
        echo "AGENT_AZDO_TEST_ENV_ID=$(AGENT_AZDO_TEST_ENV_ID)"

        export AGENT_REPORT_PATH="$(PLAYWRIGHT_JUNIT_FULL_PATH)"
        export AGENT_REPORT_FORMAT="junit"
        export AGENT_REPORTER_TYPE="azuredevops"
        export AGENT_AZDO_ORG="$(AGENT_AZDO_ORG)"
        export AGENT_AZDO_PROJECT="$(AGENT_AZDO_PROJECT)"
        export AGENT_AZDO_PAT="$(AGENT_AZDO_PAT)"
        
        ./$(AGENT_BINARY_NAME)
      displayName: 'Run Agent Binary for Playwright'
      workingDirectory: '$(ROOT_PROJECT_DIR)'
      condition: succeededOrFailed()

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(PLAYWRIGHT_JUNIT_FULL_PATH)'
        searchFolder: '$(System.DefaultWorkingDirectory)/$(PLAYWRIGHT_PROJECT_DIR)' # Search within the Playwright project dir
        mergeTestResults: true
        failTaskOnFailedTests: true
        testRunTitle: 'Playwright Test Results'
      displayName: 'Publish Playwright JUnit Test Results'
      condition: succeededOrFailed()

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(PLAYWRIGHT_HTML_REPORT_DIR)'
        artifactName: 'PlaywrightHTMLReport'
        publishLocation: 'Container'
      displayName: 'Publish Playwright HTML Report'
      condition: succeededOrFailed()

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(PLAYWRIGHT_JUNIT_FULL_PATH)'
        artifactName: 'PlaywrightJUnitXMLReport' # Renamed for clarity
        publishLocation: 'Container'
      displayName: 'Publish Playwright JUnit XML Report File'
      condition: succeededOrFailed()

  # Job for Cypress Tests
  - job: CypressTests
    displayName: 'Run Cypress Tests'
    dependsOn: [] # Runs in parallel with PlaywrightTests if agents are available
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Install Node.js $(NODE_VERSION)'

    - script: |
        echo "Downloading agent binary: $(AGENT_BINARY_NAME) from $(AGENT_BINARY_URL)"
        curl -L -o $(AGENT_BINARY_NAME) "$(AGENT_BINARY_URL)"
        chmod +x $(AGENT_BINARY_NAME)
      displayName: 'Download Agent Binary'
      workingDirectory: '$(ROOT_PROJECT_DIR)' # Agent binary expects to run where report is, or adjust path
      condition: succeededOrFailed()

    - script: |
        npm ci
      displayName: 'Install Cypress Project Dependencies (npm ci)'
      workingDirectory: '$(CYPRESS_PROJECT_DIR)'

    - script: |
        npm test
      displayName: 'Run Cypress Tests (npm test)'
      workingDirectory: '$(CYPRESS_PROJECT_DIR)'
      continueOnError: true # Allow publishing results even if tests fail

    - script: |
        echo "Run agent binary: $(AGENT_BINARY_NAME)"

        echo "Setting environment variables for agent:"
        echo "AGENT_REPORT_PATH=$(CYPRESS_JUNIT_REPORTS_DIR)"
        echo "AGENT_REPORT_FORMAT=junit"
        echo "AGENT_REPORTER_TYPE=azuredevops"
        echo "AGENT_AZDO_ORG=$(AGENT_AZDO_ORG)"
        echo "AGENT_AZDO_PROJECT=$(AGENT_AZDO_PROJECT)"
        echo "AGENT_AZDO_TEST_POINT_ID=$(AGENT_AZDO_TEST_POINT_ID)"
        echo "AGENT_AZDO_TEST_ENV_ID=$(AGENT_AZDO_TEST_ENV_ID)"

        export AGENT_REPORT_PATH="$(CYPRESS_JUNIT_REPORTS_DIR)"
        export AGENT_REPORT_FORMAT="junit"
        export AGENT_REPORTER_TYPE="azuredevops"
        export AGENT_AZDO_ORG="$(AGENT_AZDO_ORG)"
        export AGENT_AZDO_PROJECT="$(AGENT_AZDO_PROJECT)"
        export AGENT_AZDO_PAT="$(AGENT_AZDO_PAT)"
        
        ./$(AGENT_BINARY_NAME)
      displayName: 'Run Agent Binary for Cypress'
      workingDirectory: '$(ROOT_PROJECT_DIR)'
      condition: succeededOrFailed()

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(CYPRESS_JUNIT_PATTERN)' # Use the pattern for Cypress JUnit files
        searchFolder: '$(System.DefaultWorkingDirectory)/$(CYPRESS_PROJECT_DIR)' # Search within the Cypress project dir
        mergeTestResults: true # Merges multiple JUnit XML files if found by pattern
        failTaskOnFailedTests: true
        testRunTitle: 'Cypress Test Results'
      displayName: 'Publish Cypress JUnit Test Results'
      condition: succeededOrFailed()

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(CYPRESS_VIDEOS_DIR)'
        artifactName: 'CypressVideos'
        publishLocation: 'Container'
      displayName: 'Publish Cypress Videos'
      condition: succeededOrFailed() # Publish even if some tests failed

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(CYPRESS_SCREENSHOTS_DIR)'
        artifactName: 'CypressScreenshots'
        publishLocation: 'Container'
      displayName: 'Publish Cypress Screenshots'
      condition: succeededOrFailed() # Publish even if some tests failed

  - job: PytestBddPlaywrightTests
    displayName: 'Run Pytest-BDD with Playwright Tests'
    dependsOn: [] # Runs in parallel if agents are available
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
      displayName: 'Set up Python $(PYTHON_VERSION)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install Pytest-BDD Project Dependencies'
      workingDirectory: '$(PYTEST_BDD_PROJECT_DIR)'

    - script: |
        echo "Downloading agent binary: $(AGENT_BINARY_NAME) from $(AGENT_BINARY_URL)"
        curl -L -o $(AGENT_BINARY_NAME) "$(AGENT_BINARY_URL)"
        chmod +x $(AGENT_BINARY_NAME)
      displayName: 'Download Agent Binary'
      workingDirectory: '$(ROOT_PROJECT_DIR)' # Agent binary expects to run where report is, or adjust path
      condition: succeededOrFailed()

    - script: |
        playwright install --with-deps chromium # Install chromium, or specify other browsers
      displayName: 'Install Playwright Browsers for Python'
      workingDirectory: '$(PYTEST_BDD_PROJECT_DIR)'

    - script: |
        pytest --clean-alluredir
      displayName: 'Run Pytest-BDD Tests & Generate Allure Results'
      workingDirectory: '$(PYTEST_BDD_PROJECT_DIR)'
      continueOnError: true # Continue to generate report even if tests fail

    - script: |
        echo "Run agent binary: $(AGENT_BINARY_NAME)"

        echo "Setting environment variables for agent:"
        echo "AGENT_REPORT_PATH=$(PYTEST_BDD_ALLURE_RESULTS_DIR)"
        echo "AGENT_REPORT_FORMAT=allure"
        echo "AGENT_REPORTER_TYPE=azuredevops"
        echo "AGENT_AZDO_ORG=$(AGENT_AZDO_ORG)"
        echo "AGENT_AZDO_PROJECT=$(AGENT_AZDO_PROJECT)"
        echo "AGENT_AZDO_TEST_POINT_ID=$(AGENT_AZDO_TEST_POINT_ID)"
        echo "AGENT_AZDO_TEST_ENV_ID=$(AGENT_AZDO_TEST_ENV_ID)"

        export AGENT_REPORT_PATH="$(PYTEST_BDD_ALLURE_RESULTS_DIR)"
        export AGENT_REPORT_FORMAT="allure"
        export AGENT_REPORTER_TYPE="azuredevops"
        export AGENT_AZDO_ORG="$(AGENT_AZDO_ORG)"
        export AGENT_AZDO_PROJECT="$(AGENT_AZDO_PROJECT)"
        export AGENT_AZDO_PAT="$(AGENT_AZDO_PAT)"
        
        ./$(AGENT_BINARY_NAME)
      displayName: 'Run Agent Binary for Pytest-BDD with Playwright'
      workingDirectory: '$(ROOT_PROJECT_DIR)'
      condition: succeededOrFailed()

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(PYTEST_BDD_ALLURE_REPORT_DIR)'
        artifactName: 'PytestBddAllureReport'
        publishLocation: 'Container'
      displayName: 'Publish Pytest-BDD Allure HTML Report'
      condition: succeededOrFailed()

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(PYTEST_BDD_ALLURE_RESULTS_DIR)'
        artifactName: 'PytestBddAllureJsonResults' # Optional: publish raw JSON results
        publishLocation: 'Container'
      displayName: 'Publish Pytest-BDD Allure JSON Results'
      condition: succeededOrFailed()