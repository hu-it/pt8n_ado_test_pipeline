trigger: # Continuous Integration (CI) trigger for pushes to specified branches
- main

pr: # Pull Request (PR) trigger configuration
  branches:
    include:
    - main # Trigger pipeline for Pull Requests targeting the 'main' branch
  # paths:
  #   include:
  #   - 'src/*'
  #   exclude:
  #   - 'docs/*'
  #   - '*.md'

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '18.x'

  # Playwright specific variables
  PLAYWRIGHT_PROJECT_DIR: '.' # Assuming Playwright is in the root or use specific folder
  PLAYWRIGHT_HTML_REPORT_DIR: '$(PLAYWRIGHT_PROJECT_DIR)/playwright-report'
  PLAYWRIGHT_JUNIT_RESULTS_DIR: '$(PLAYWRIGHT_PROJECT_DIR)/test-results' # Directory for Playwright JUnit XML
  PLAYWRIGHT_JUNIT_FULL_PATH: '$(PLAYWRIGHT_JUNIT_RESULTS_DIR)' # Full path to Playwright JUnit results file

  # Agent Binary variables (used by Playwright job)
  AGENT_BINARY_NAME: 'test-report-agent'
  AGENT_BINARY_URL: 'https://github.com/hu-it/pt8n_ado_t_test_agent_binary/releases/download/v0.0.1/test-report-agent'

  # Cypress specific variables
  CYPRESS_PROJECT_DIR: 'cypress-project' # Subdirectory for the Cypress project
  CYPRESS_JUNIT_REPORTS_DIR: '$(CYPRESS_PROJECT_DIR)/results'
  CYPRESS_VIDEOS_DIR: '$(CYPRESS_PROJECT_DIR)/cypress/videos'
  CYPRESS_SCREENSHOTS_DIR: '$(CYPRESS_PROJECT_DIR)/cypress/screenshots'

stages:
- stage: BuildAndTest
  displayName: 'Build and Test Stage'
  jobs:
  # Job for Playwright Tests
  - job: PlaywrightTests
    displayName: 'Run Playwright Tests'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Install Node.js $(NODE_VERSION)'

    - script: |
        npm ci
      displayName: 'Install Playwright Project Dependencies (npm ci)'
      workingDirectory: '$(PLAYWRIGHT_PROJECT_DIR)'

    - script: |
        npx playwright install --with-deps
      displayName: 'Install Playwright Browsers & Dependencies'
      workingDirectory: '$(PLAYWRIGHT_PROJECT_DIR)'

    - script: |
        mkdir -p $(PLAYWRIGHT_JUNIT_RESULTS_DIR)
      displayName: 'Create Playwright JUnit results directory'
      workingDirectory: '$(PLAYWRIGHT_PROJECT_DIR)'

    - script: |
        npm test
      displayName: 'Run Playwright Tests (npm test)'
      workingDirectory: '$(PLAYWRIGHT_PROJECT_DIR)'
      continueOnError: true

    - script: |
        echo "Downloading agent binary: $(AGENT_BINARY_NAME) from $(AGENT_BINARY_URL)"
        curl -L -o $(AGENT_BINARY_NAME) "$(AGENT_BINARY_URL)"
        chmod +x $(AGENT_BINARY_NAME)

        echo "Setting environment variables for agent:"
        echo "AGENT_REPORT_PATH=$(PLAYWRIGHT_JUNIT_FULL_PATH)"
        echo "AGENT_REPORT_FORMAT=junit"
        echo "AGENT_REPORTER_TYPE=stdout"

        export AGENT_REPORT_PATH="$(PLAYWRIGHT_JUNIT_FULL_PATH)"
        export AGENT_REPORT_FORMAT="junit"
        export AGENT_REPORTER_TYPE="stdout"
        
        ./$(AGENT_BINARY_NAME)
      displayName: 'Download and Run Agent Binary for Playwright'
      workingDirectory: '$(PLAYWRIGHT_PROJECT_DIR)' # Agent binary expects to run where report is, or adjust path
      condition: succeededOrFailed()

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(PLAYWRIGHT_JUNIT_FULL_PATH)'
        searchFolder: '$(System.DefaultWorkingDirectory)/$(PLAYWRIGHT_PROJECT_DIR)' # Search within the Playwright project dir
        mergeTestResults: true
        failTaskOnFailedTests: true
        testRunTitle: 'Playwright Test Results'
      displayName: 'Publish Playwright JUnit Test Results'
      condition: succeededOrFailed()

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(PLAYWRIGHT_HTML_REPORT_DIR)'
        artifactName: 'PlaywrightHTMLReport'
        publishLocation: 'Container'
      displayName: 'Publish Playwright HTML Report'
      condition: succeededOrFailed()

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(PLAYWRIGHT_JUNIT_FULL_PATH)'
        artifactName: 'PlaywrightJUnitXMLReport' # Renamed for clarity
        publishLocation: 'Container'
      displayName: 'Publish Playwright JUnit XML Report File'
      condition: succeededOrFailed()

  # Job for Cypress Tests
  - job: CypressTests
    displayName: 'Run Cypress Tests'
    dependsOn: [] # Runs in parallel with PlaywrightTests if agents are available
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Install Node.js $(NODE_VERSION)'

    - script: |
        npm ci
      displayName: 'Install Cypress Project Dependencies (npm ci)'
      workingDirectory: '$(CYPRESS_PROJECT_DIR)'

    # Cypress typically bundles its browser, but if system dependencies are needed for the bundled browser:
    # - script: npx cypress install # This is usually not needed for `run` if `npm ci` installed cypress
    #   displayName: 'Ensure Cypress is installed'
    #   workingDirectory: '$(CYPRESS_PROJECT_DIR)'

    - script: |
        mkdir -p $(CYPRESS_REPORTS_DIR)
      displayName: 'Create Cypress reports directory'
      workingDirectory: '$(System.DefaultWorkingDirectory)' # Create relative to root, or adjust path

    - script: |
        npm test
      displayName: 'Run Cypress Tests (npm test)'
      workingDirectory: '$(CYPRESS_PROJECT_DIR)'
      continueOnError: true # Allow publishing results even if tests fail

    - script: |
        echo "Downloading agent binary: $(AGENT_BINARY_NAME) from $(AGENT_BINARY_URL)"
        curl -L -o $(AGENT_BINARY_NAME) "$(AGENT_BINARY_URL)"
        chmod +x $(AGENT_BINARY_NAME)

        echo "Setting environment variables for agent:"
        echo "AGENT_REPORT_PATH=$(CYPRESS_JUNIT_REPORTS_DIR)"
        echo "AGENT_REPORT_FORMAT=junit"
        echo "AGENT_REPORTER_TYPE=stdout"

        export AGENT_REPORT_PATH="$(CYPRESS_JUNIT_REPORTS_DIR)"
        export AGENT_REPORT_FORMAT="junit"
        export AGENT_REPORTER_TYPE="stdout"
        
        ./$(AGENT_BINARY_NAME)
      displayName: 'Download and Run Agent Binary for Cypress'
      workingDirectory: '$(PLAYWRIGHT_PROJECT_DIR)' # Agent binary expects to run where report is, or adjust path
      condition: succeededOrFailed()

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(CYPRESS_JUNIT_PATTERN)' # Use the pattern for Cypress JUnit files
        searchFolder: '$(System.DefaultWorkingDirectory)/$(CYPRESS_PROJECT_DIR)' # Search within the Cypress project dir
        mergeTestResults: true # Merges multiple JUnit XML files if found by pattern
        failTaskOnFailedTests: true
        testRunTitle: 'Cypress Test Results'
      displayName: 'Publish Cypress JUnit Test Results'
      condition: succeededOrFailed()

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(CYPRESS_VIDEOS_DIR)'
        artifactName: 'CypressVideos'
        publishLocation: 'Container'
      displayName: 'Publish Cypress Videos'
      condition: succeededOrFailed() # Publish even if some tests failed

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(CYPRESS_SCREENSHOTS_DIR)'
        artifactName: 'CypressScreenshots'
        publishLocation: 'Container'
      displayName: 'Publish Cypress Screenshots'
      condition: succeededOrFailed() # Publish even if some tests failed
